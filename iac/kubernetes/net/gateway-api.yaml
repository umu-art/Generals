apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: generals-gateway
  namespace: istio-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-issuer
spec:
  gatewayClassName: istio
  addresses:
    - type: Hostname
      value: istio-ingressgateway.istio-system.svc.cluster.local
  listeners:
    - name: http-generals-umu-art-ru
      port: 80
      protocol: HTTP
      hostname: "generals.umu-art.ru"
      allowedRoutes:
        namespaces:
          from: All
    - name: https-generals-umu-art-ru
      port: 443
      protocol: HTTPS
      hostname: "generals.umu-art.ru"
      tls:
        mode: Terminate
        certificateRefs:
          - name: generals-umu-art-ru-tls
            namespace: istio-system
      allowedRoutes:
        namespaces:
          from: All
