apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: generals-httproute
  namespace: generals
spec:
  parentRefs:
    - name: generals-gateway
      namespace: istio-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /backend
      backendRefs:
        - name: g-core
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: g-ui
          port: 80
